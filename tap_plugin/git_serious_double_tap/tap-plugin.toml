manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.1.6"
slug = "git_serious_double_tap"
name = "git-serious double-tap"
description = "The unified-systems-com instance configuration for git-serious: the pages and panels specific to observing the organization that builds TAP. A double-tap plugin — one that introspects the TAP system itself."

# No code-import dependencies: the pages here mount git_serious's panels by entity id in GRIFT
# edges. That is an INSTALL + SEED-ORDER dependency (pyproject `dependencies`; boot-profile
# population order), not an import-time edge. See pyproject.toml.
depends_on = [
    { slug = "git_serious", note = "The tap page mounts git_serious's panels by id (git-serious-double-tap#11); the strip links to git_serious's pages." },
    { slug = "zizmor", note = "This instance seeds zizmor's pages and fires its collector after github_core, so the slug must resolve at boot — the record's cold-resolve gate checks exactly that. Offline and credential-free; its two non-validated crypto providers are waived in both records that install it." },
]

# Pure configuration — no crypto, no native deps (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

[grift]
home = "grift/home.grift.json"
tap_machinery = "grift/tap-machinery.grift.json"
tap_repository = "grift/tap-repository.grift.json"

# In-package boot record (req-boot-bootstrap-records-in-package): the unified-systems-com
# instance composition — git-serious plus this plugin, landing on /double-tap. Digest is the
# canonical sha256 of the record; regenerate with scripts/boot-record-hash --refresh in a core
# checkout (the shipped record test asserts it); never hand-edit.
[[boot.records]]
name = "git_serious_double_tap"
description = "unified-systems-com instance of git-serious: the product's closure + the double-tap plugin, seeded in order, collector fired against the org, landing page pinned to /double-tap (web.landing_entity_id + web.landing_slug)."
sha256 = "3188d499e566de48e64b2562f4ebb134fbef935948659159b73f15612ee4da3d"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
sha256 = "be54771b48e70ef5869834870f1b5f9ad4374f194cc5a5ebc8c8365f1a6af6e6"
